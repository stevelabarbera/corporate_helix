name: Root resolver safety
on:
  push:
    branches: [fix/identity-safety-sempra-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  root-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated GLEIF resolver regression suite
        run: python3 tests/test_root_entity_resolver.py
