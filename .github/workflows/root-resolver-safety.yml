name: Root resolver safety
on:
  push:
    branches: [fix/identity-safety-sempra-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  root-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest ijson
      - name: Compile integration Python modules
        run: |
          python -m compileall -q code/root_entity_resolver.py code/identity_lookup.py code/build_gleif_lei_index.py code/migrate_gleif_lookup_key.py code/helix_company.py code/run_company_ma_expansion.py code/run_identity_benchmark.py code/run_identity_start_benchmark.py code/validate_gleif_real_db.py code/screen_gleif_real_identity.py code/inspect_gleif_relationship.py code/audit_gleif_rr_source.py
      - name: Run combined GLEIF and EDGAR identity regressions
        run: python -m pytest -q tests/test_root_entity_resolver.py tests/test_gleif_identity_lookup_key.py tests/test_edgar_resolver_identity_key.py tests/test_ma_start_diagnostics.py tests/test_real_gleif_identity_screen.py tests/test_identity_vs_corporate_root.py tests/test_inspect_gleif_relationship.py tests/test_audit_gleif_rr_source.py
      - name: Run direct resolver regression entry point
        run: python3 tests/test_root_entity_resolver.py
