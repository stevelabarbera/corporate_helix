name: Identity lookup regression
on:
  push:
    branches: [fix/identity-resolution-contract]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  identity-lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal test dependencies
        run: python -m pip install ijson pytest
      - name: Compile changed Python modules
        run: python -m compileall -q code/identity_lookup.py code/build_gleif_lei_index.py code/migrate_gleif_lookup_key.py code/root_entity_resolver.py code/helix_company.py
      - name: Run identity lookup regressions
        run: python -m pytest -q tests/test_gleif_identity_lookup_key.py tests/test_edgar_resolver_identity_key.py
